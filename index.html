<!DOCTYPE html>
<html class="dark" lang="en">
<head>

    <title>TETRIS NEON - Kinetic Kinetic</title>

                extend: {

                        "primary-fixed": "#00eefc",

                        "on-surface-variant": "#acaab1",
                        "on-error": "#490006",
                        "error": "#ff716c",
                        "on-primary": "#005d63",
                        "secondary-fixed-dim": "#e1b2ff",
                        "on-tertiary": "#0d6100",
                        "on-primary-container": "#005359",
                        "tertiary": "#8eff71",
                        "on-primary-fixed-variant": "#005e64",
                        "on-background": "#f9f5fd",
                        "primary": "#8ff5ff",
                        "primary-container": "#00eefc",
                        "inverse-on-surface": "#55545b",
                        "tertiary-container": "#2ff801",
                        "on-surface": "#f9f5fd",
                        "error-dim": "#d7383b",
                        "on-primary-fixed": "#003f43",
                        "tertiary-fixed": "#2ff801",

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .neon-glow-primary {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5), 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .neon-glow-secondary {
            text-shadow: 0 0 10px rgba(201, 124, 255, 0.5), 0 0 20px rgba(201, 124, 255, 0.3);
        }
        .glass-panel {
            background: rgba(37, 37, 45, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .grid-bg {
            background-image: 
                linear-gradient(to right, rgba(143, 245, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(143, 245, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .game-grid {
            /* Responsive grid lines that match 10x20 columns/rows */
            background-image: 
                linear-gradient(to right, rgba(143, 245, 255, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(143, 245, 255, 0.08) 1px, transparent 1px);
            background-size: 10% 5%;
        }
        .solid-cube {
            position: relative;
            background: var(--block-color);
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            box-shadow: 
                inset 2px 2px 0px rgba(255, 255, 255, 0.5),
                inset -3px -3px 0px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.4);
            transform: scale(0.98); /* Tiny gap to simulate real blocks */
        }
        .piece-active .solid-cube {
            filter: saturate(1.5) brightness(1.1);
        }
        @keyframes shockwave {
            0% { transform: scale(0.5); opacity: 1; border-width: 8px; }
            100% { transform: scale(3.5); opacity: 0; border-width: 1px; }
        }
        .shockwave {
            position: absolute;
            border: 2px solid var(--impact-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: shockwave 0.5s cubic-bezier(0, 0.5, 0.5, 1) forwards;
        }
        @keyframes heavy-shake {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-3px, -2px); }
            20% { transform: translate(3px, 2px); }
            30% { transform: translate(-3px, 1px); }
            40% { transform: translate(2px, -1px); }
            50% { transform: translate(-1px, 2px); }
            60% { transform: translate(1px, -2px); }
            100% { transform: translate(0, 0); }
        }
        .landed-impact-shake {
            animation: heavy-shake 0.25s ease-out;
        }
        .dpad-btn:active {
            background-color: rgba(0, 240, 255, 0.15);
            border-color: #00F0FF;
            color: #00F0FF;
            transform: scale(0.95);
        }
        #game-board-container div {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body {
            background-color: #0e0e13;
            min-height: max(884px, 100dvh);
            overflow-x: hidden;
        }
    </style>
</head>
<body class="font-body text-on-surface selection:bg-primary selection:text-on-primary">

<!-- Shared Background Logic -->
<div id="shared-bg" class="fixed inset-0 z-0 grid-bg overflow-hidden pointer-events-none">
    <div class="absolute top-[20%] right-[15%] opacity-15 -rotate-45">
        <div class="flex flex-col gap-1">
            <div class="w-10 h-10 bg-primary rounded-sm shadow-[0_0_15px_#8ff5ff]"></div>
            <div class="w-10 h-10 bg-primary rounded-sm shadow-[0_0_15px_#8ff5ff]"></div>
            <div class="w-10 h-10 bg-primary rounded-sm shadow-[0_0_15px_#8ff5ff]"></div>
            <div class="w-10 h-10 bg-primary rounded-sm shadow-[0_0_15px_#8ff5ff]"></div>
        </div>
    </div>
    <div class="absolute bottom-[30%] left-[5%] opacity-10 rotate-180">
        <div class="grid grid-cols-3 gap-1">
            <div class="w-10 h-10 bg-tertiary rounded-sm shadow-[0_0_15px_#8eff71]"></div>
            <div class="w-10 h-10 bg-tertiary rounded-sm shadow-[0_0_15px_#8eff71]"></div>
            <div class="w-10 h-10 bg-transparent"></div>
            <div class="w-10 h-10 bg-transparent"></div>
            <div class="w-10 h-10 bg-tertiary rounded-sm shadow-[0_0_15px_#8eff71]"></div>
            <div class="w-10 h-10 bg-tertiary rounded-sm shadow-[0_0_15px_#8eff71]"></div>
        </div>
    </div>
    <div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-background/50 pointer-events-none"></div>
</div>

<!-- Shared TopAppBar -->
<header class="fixed top-0 left-0 w-full z-[100] flex justify-between items-center px-6 py-4 bg-[#0e0e13]/80 backdrop-blur-xl">
    <div class="flex items-center gap-4">
        <span id="menu-toggle" class="material-symbols-outlined text-[#00F0FF] cursor-pointer hover:text-[#8ff5ff] transition-colors active:scale-95 duration-100">menu</span>
        <div class="font-headline text-2xl font-black italic tracking-tighter text-[#00F0FF] drop-shadow-[0_0_10px_rgba(0,240,255,0.5)] uppercase">
            TETRIS NEON
        </div>
    </div>
    <div class="flex items-center gap-6">
        <span class="hidden md:block font-headline text-slate-500 tracking-tighter uppercase font-bold text-sm hover:text-[#8ff5ff] transition-colors cursor-pointer nav-link" data-target="leaderboard">RANKING</span>
        <span class="material-symbols-outlined text-[#00F0FF] cursor-pointer hover:text-[#8ff5ff] transition-colors active:scale-95 duration-100">settings</span>
    </div>
</header>

<!-- MAIN MENU SCREEN -->
<section id="screen-menu" class="relative z-10 min-h-screen flex flex-col items-center justify-center pt-24 pb-32 px-6">
    <div class="w-full max-w-4xl flex flex-col items-center mb-16 text-center">
        <div class="relative group">
            <h1 class="font-headline text-[8rem] md:text-[12rem] font-black tracking-[-0.05em] text-transparent bg-clip-text bg-gradient-to-b from-primary via-primary-container to-secondary leading-none select-none drop-shadow-[0_0_40px_rgba(0,240,255,0.4)]">
                TETRIS
            </h1>
            <div class="absolute -bottom-4 right-0 font-headline text-2xl font-bold tracking-[0.5em] text-secondary neon-glow-secondary opacity-80 uppercase">
                NEON KINETIC
            </div>
        </div>
    </div>
    
    <div class="w-full max-w-md space-y-4">
        <button id="play-now-btn" class="w-full group relative overflow-hidden bg-gradient-to-r from-primary to-primary-container rounded-xl py-6 flex items-center justify-center shadow-[0_10px_30px_rgba(0,240,255,0.3)] hover:shadow-[0_15px_40px_rgba(0,240,255,0.5)] transition-all duration-300 active:scale-95">
            <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <div class="relative flex items-center gap-3">
                <span class="material-symbols-outlined text-on-primary text-3xl">play_arrow</span>
                <span class="font-headline text-3xl font-black text-on-primary tracking-tighter uppercase">PLAY NOW</span>
            </div>
        </button>
        
        <div class="grid grid-cols-2 gap-4">
            <button class="glass-panel flex flex-col items-start justify-end p-6 rounded-xl min-h-[140px] group transition-all hover:bg-surface-container-highest active:scale-95 shadow-lg nav-link" data-target="leaderboard">
                <span class="material-symbols-outlined text-secondary text-4xl mb-4 group-hover:scale-110 transition-transform">leaderboard</span>
                <div>
                    <span class="block font-headline text-lg font-bold text-on-surface uppercase tracking-tight">LEADERBOARD</span>
                    <span class="block font-body text-xs text-on-surface-variant font-medium">Rank #243</span>
                </div>
            </button>
            <button class="glass-panel flex flex-col items-start justify-end p-6 rounded-xl min-h-[140px] group transition-all hover:bg-surface-container-highest active:scale-95 shadow-lg">
                <span class="material-symbols-outlined text-tertiary text-4xl mb-4 group-hover:scale-110 transition-transform">sports_esports</span>
                <div>
                    <span class="block font-headline text-lg font-bold text-on-surface uppercase tracking-tight">LEVELS</span>
                    <span class="block font-body text-xs text-on-surface-variant font-medium">12 Unlocked</span>
                </div>
            </button>
        </div>
    </div>
</section>

<!-- GAMEPLAY SCREEN -->
<section id="screen-game" class="hidden relative z-10 min-h-screen pt-20 pb-28 px-4 flex flex-col items-center">
    <main class="flex-grow flex flex-col pt-4 max-w-lg mx-auto w-full relative">
        <div class="flex gap-4 items-start h-full">
            <!-- Board -->
            <div class="relative flex-grow aspect-[10/20] bg-surface-container-low rounded-xl overflow-hidden shadow-2xl outline-variant/10 outline outline-1" id="board-impact-container">
                <div class="absolute inset-0 game-grid"></div>
                <div id="game-board-container" class="absolute inset-0 grid grid-cols-10 grid-rows-20 gap-0">
                    <!-- DOM cells will be injected here -->
                </div>
                <div id="impact-visuals" class="absolute inset-0 pointer-events-none z-40"></div>
            </div>
            
            <!-- Side HUD -->
            <div class="flex flex-col gap-4 w-28 shrink-0">
                <div class="bg-surface-container-high rounded-xl p-4 flex flex-col items-end shadow-lg border border-outline-variant/10">
                    <span class="text-on-surface-variant font-headline text-[10px] tracking-widest uppercase">SCORE</span>
                    <span id="score-val" class="text-secondary font-headline text-2xl font-bold leading-tight">0</span>
                </div>
                <div class="bg-surface-container-high rounded-xl p-4 flex flex-col items-center gap-4 shadow-lg border border-outline-variant/10">
                    <span class="text-on-surface-variant font-headline text-[10px] tracking-widest uppercase self-end">NEXT</span>
                    <div id="next-piece-preview" class="flex items-center justify-center min-h-[4rem]">
                        <canvas id="next-canvas" width="80" height="80"></canvas>
                    </div>
                </div>
                <div class="bg-surface-container-high rounded-xl p-4 flex flex-col items-end shadow-lg mt-auto border border-outline-variant/10">
                    <span class="text-on-surface-variant font-headline text-[10px] tracking-widest uppercase">LEVEL</span>
                    <span id="level-val" class="text-primary font-headline text-2xl font-bold">1</span>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="mt-8 grid grid-cols-12 gap-2 items-center h-40">
            <div class="col-span-5 relative w-32 h-32 mx-auto">
                <button id="ctrl-up" class="absolute top-0 left-1/2 -translate-x-1/2 w-10 h-10 bg-surface-container-highest rounded-lg flex items-center justify-center text-primary-container shadow-inner border border-outline-variant/20 transition-all dpad-btn">
                    <span class="material-symbols-outlined">rotate_right</span>
                </button>
                <button id="ctrl-down" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-10 h-10 bg-surface-container-highest rounded-lg flex items-center justify-center text-primary-container shadow-inner border border-outline-variant/20 transition-all dpad-btn">
                    <span class="material-symbols-outlined">keyboard_arrow_down</span>
                </button>
                <button id="ctrl-left" class="absolute left-0 top-1/2 -translate-y-1/2 w-10 h-10 bg-surface-container-highest rounded-lg flex items-center justify-center text-primary-container shadow-inner border border-outline-variant/20 transition-all dpad-btn">
                    <span class="material-symbols-outlined">keyboard_arrow_left</span>
                </button>
                <button id="ctrl-right" class="absolute right-0 top-1/2 -translate-y-1/2 w-10 h-10 bg-surface-container-highest rounded-lg flex items-center justify-center text-primary-container shadow-inner border border-outline-variant/20 transition-all dpad-btn">
                    <span class="material-symbols-outlined">keyboard_arrow_right</span>
                </button>
            </div>
            <div class="col-span-2 flex justify-center">
                <button id="ctrl-hard-drop" class="w-14 h-14 rounded-xl bg-surface-container-highest flex items-center justify-center text-tertiary shadow-[0_0_15px_rgba(47,248,1,0.2)] border border-tertiary/20 active:scale-90 transition-all relative overflow-hidden group">
                    <span class="material-symbols-outlined text-3xl font-bold">vertical_align_bottom</span>
                </button>
            </div>
            <div class="col-span-5 flex gap-3 justify-end items-center pr-2">
                <button id="ctrl-hold" class="w-14 h-14 rounded-full bg-surface-container-highest text-primary flex items-center justify-center border border-primary/20 active:scale-95 transition-transform duration-150">
                    <span class="material-symbols-outlined text-2xl">swap_horiz</span>
                </button>
                <button id="ctrl-rotate" class="w-16 h-16 rounded-full bg-gradient-to-br from-secondary to-secondary-container text-white flex items-center justify-center shadow-[0_6px_18px_rgba(201,124,255,0.3)] active:scale-95 transition-transform duration-150">
                    <span class="material-symbols-outlined text-3xl">rotate_right</span>
                </button>
            </div>
        </div>
    </main>
</section>

<!-- LEADERBOARD SCREEN -->
<section id="screen-leaderboard" class="hidden relative z-10 pt-24 pb-32 px-6 max-w-5xl mx-auto w-full min-h-screen">

    <div class="bg-surface-container-low rounded-2xl p-1 md:p-4 mb-8">

                <div class="flex items-center gap-6">
                    <span class="font-headline text-2xl font-black italic text-primary w-8">01</span>
                    <div class="flex items-center gap-4">
                        <span class="font-headline font-bold text-lg text-on-surface uppercase tracking-tight">CYBER_QUEEN</span>

                </div>
                <span class="font-headline text-2xl font-black text-on-surface tracking-tighter">1,205,400</span>
            </div>
        </div>
    </div>
    
    <div class="flex justify-center">
        <button class="bg-surface-container-highest text-on-surface py-4 px-12 rounded-xl font-headline font-bold uppercase tracking-widest border border-outline-variant/30 hover:bg-surface-bright active:scale-95 transition-all nav-link" data-target="menu">
            BACK TO HOME
        </button>
    </div>
</section>

<!-- GAME OVER OVERLAY -->

    <div class="w-full max-w-md bg-surface-container-lowest/60 backdrop-blur-2xl rounded-full p-1 shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-outline-variant/10 overflow-hidden scale-in">

                    <span class="material-symbols-outlined text-secondary-dim text-3xl opacity-50">speed</span>

            </div>
            
            <div class="flex flex-col w-full gap-4">
                <button id="replay-btn" class="w-full bg-gradient-to-br from-primary to-primary-container py-5 rounded-xl text-on-primary font-headline font-extrabold text-lg tracking-widest uppercase shadow-[0_0_30px_rgba(143,245,255,0.4)] active:scale-95 transition-all duration-100 hover:brightness-110">

                </button>
                <button id="menu-back-btn" class="w-full bg-surface-container-highest/80 border border-outline-variant/30 py-5 rounded-xl text-on-surface font-headline font-bold text-lg tracking-widest uppercase active:scale-95 transition-all duration-100 hover:bg-surface-bright">
                    HOME
                </button>
            </div>
        </div>
    </div>
</div>
